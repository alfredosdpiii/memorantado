name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate review evidence
        id: evidence
        run: |
          {
            echo "## Automated review summary"
            echo
            npm run lint
            npm run typecheck
            npm run test -- --reporter=dot
          } > review-summary.md

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.existsSync("review-summary.md")
              ? fs.readFileSync("review-summary.md", "utf8")
              : "Automated review did not produce a summary.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
